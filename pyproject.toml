[project]
name = "mpigeon-server"
version = "0.3.0"
description = "Message Pigeon Backend (FastAPI)"
authors = [{ name = "jsun969" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "greenlet>=3.1",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "nanoid>=2.0",
    "apscheduler>=3.11",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "aiosqlite>=0.20",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Pydantic generic models use the Generic[T] base, not PEP 695 type params.
ignore = ["UP046"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
