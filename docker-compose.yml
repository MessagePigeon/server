services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: pigeon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      # Published on 5433 to avoid clashing with a host Postgres on 5432.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Override the localhost URL from .env to reach the postgres service.
      DATABASE_URL: 'postgresql+asyncpg://postgres:password@postgres:5432/pigeon'
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
